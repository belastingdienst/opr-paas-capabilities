name: secret-scanning

# This repository is a template that people copy. Make sure no real secrets end up in it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the working tree for secrets
        # Scans the files as they are, not the git history: values already in the history are
        # public anyway and must be rotated rather than hidden.
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.18.4
          detect --no-git --source /repo --redact --verbose
