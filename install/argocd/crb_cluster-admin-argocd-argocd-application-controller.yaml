# WARNING: quickstart only, see README.md in this directory.
# Gives the central ArgoCD application-controller cluster-admin. Combined with the wildcard
# 'paas' AppProject, any resource a capability renders is applied with full cluster rights.
# Replace with a ClusterRole that only contains what your capabilities need.
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cluster-admin-argocd-argocd-application-controller
subjects:
  - kind: ServiceAccount
    name: argocd-argocd-application-controller
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
